                "2": { firstHalf: true, secondHalf: false, feast: false, paidFirst: false, paidSecond: false, paidFeast: false, refundPaid: false, note: "" },

        class MessApp {
            constructor() {
                this.db = this.loadData();
                this.currentUser = null;
                this.currentTab = 'home';
                
                this.memberFilters = {
                    batch: 'ALL',
                    floor: 'ALL',
                    payment: 'ALL',
                    note: 'ALL'
                };

                this.pdfBatchFilters = ['ALL'];
                this.pdfFloorFilters = ['ALL'];
                this.pdfTargetGender = 'Male';

                this.checkAndPerformWeeklyReset();
                this.init();
            }

            loadData() {
                // ফায়ারবেস থেকে রিয়েলটাইম ডাটা লোড করার জন্য ইনিশিয়াল ডাটা রিটার্ন করা হচ্ছে
                if (window.firebaseDb) {
                    const dbRef = window.firebaseRef(window.firebaseDb, 'nmc_mess_data');
                    window.firebaseOnValue(dbRef, (snapshot) => {
                        const val = snapshot.val();
                        if (val) {
                            this.db = val;
                            // ডাটা আপডেট হলে অ্যাপ রি-রেন্ডার করবে
                            if (window.appInstance && typeof window.appInstance.renderApp === 'function') {
                                window.appInstance.renderApp();
                            }
                        } else {
                            // যদি ফায়ারবেসে ডাটা না থাকে, তবে ডিফল্ট ডাটা সেভ করে দিবে
                            window.firebaseSet(dbRef, defaultData);
                        }
                    });
                }
                return defaultData;
            }

            saveData() {
                try {
                    if (window.firebaseDb) {
                        const dbRef = window.firebaseRef(window.firebaseDb, 'nmc_mess_data');
                        window.firebaseSet(dbRef, this.db).catch(err => {
                            console.error("Firebase save error:", err);
                        });
                    }
                } catch(e) {
                    console.error("Database save error:", e);
                }
            }

            // Calculates the timestamp of the most recent Thursday 7:00 PM (19:00) using server or stable time
            getLatestThursdayResetTime(referenceDate = new Date()) {
                const now = new Date(referenceDate);
                const day = now.getDay(); // 0: Sun, 1: Mon, ... 4: Thu, 5: Fri, 6: Sat
                const hours = now.getHours();

                const target = new Date(now);
                target.setMinutes(0, 0, 0);

                let daysBack = (day + 7 - 4) % 7;
                if (daysBack === 0 && hours < 19) {
                    daysBack = 7; 
                }

                target.setDate(now.getDate() - daysBack);
                target.setHours(19, 0, 0, 0);
                return target.getTime();
            }

            // Checks and resets meals, payments, and notes every Thursday at 7:00 PM
            checkAndPerformWeeklyReset() {
                // ফায়ারবেসের সার্ভার টাইম বা নির্ভরযোগ্য বর্তমান সময় ব্যবহার করা
                const nowTimestamp = Date.now();
                const latestThurs7PM = this.getLatestThursdayResetTime(new Date(nowTimestamp));

                if (!this.db.lastThursdayResetTimestamp || this.db.lastThursdayResetTimestamp < latestThurs7PM) {
                    Object.keys(this.db.meals).forEach(userId => {
                        this.db.meals[userId] = {
                            firstHalf: false,
                            secondHalf: false,
                            feast: false,
                            paidFirst: false,
                            paidSecond: false,
                            paidFeast: false,
                            refundPaid: false,
                            note: ""
                        };
                    });

                    this.db.lastThursdayResetTimestamp = latestThurs7PM;
                    this.saveData();
                }
            }

            // Checks if a meal type can be changed by regular students based on current schedule
            isMealToggleAllowed(mealType) {
                const roles = this.getRoles();
                // Peripherals and Secret Admins can override/toggle anytime
                if (roles.isPeripheral || roles.isSecret) return true;

                const now = new Date();
                const day = now.getDay(); // 0: Sun, 1: Mon, 2: Tue, 3: Wed, 4: Thu, 5: Fri, 6: Sat
                const hours = now.getHours();
                const minutes = now.getMinutes();
                const totalMinutes = hours * 60 + minutes;

                if (mealType === 'feast') {
                    // Thursday 10:00 AM (600 mins) to 6:00 PM (1080 mins)
                    if (day === 4 && totalMinutes >= 600 && totalMinutes <= 1080) {
                        return true;
                    }
                    return false;
                }

                if (mealType === 'firstHalf' || mealType === 'full') {
                    // Thursday 7:30 PM (1170 mins) to 10:00 PM (1320 mins)
                    if (day === 4 && totalMinutes >= 1170 && totalMinutes <= 1320) {
                        return true;
                    }
                    return false;
                }

                if (mealType === 'secondHalf') {
                    // Monday 10:00 AM (600 mins) to 10:00 PM (1320 mins)
                    if (day === 1 && totalMinutes >= 600 && totalMinutes <= 1320) {
                        return true;
                    }
                    return false;
                }

                return false;
            }

            calculateUserMealTotal(m) {
                if (!m) return 0;
                const r = this.db.mealRates;
                let total = 0;

                const hasFirst = !!m.firstHalf;
                const hasSecond = !!m.secondHalf;
                const hasFeast = (m.feast === true);

                if (hasFirst && hasSecond) {
                    total = r.fullMeal;
                    if (!hasFeast) {
                        total -= r.feastDiscount;
                    }
                } else if (hasFirst && !hasSecond) {
                    total = r.firstHalf;
                    if (hasFeast) {
                        total += r.standaloneFeast;
                    }
                } else if (!hasFirst && hasSecond) {
                    total = r.secondHalf;
                    if (!hasFeast) {
                        total -= r.feastDiscount;
                    }
                } else {
                    if (hasFeast) {
                        total = r.standaloneFeast;
                    }
                }

                return Math.max(0, total);
            }

            getUserRefundDetails(m) {
                if (!m) return { eligible: false, amount: 0, isCleared: false };
                const r = this.db.mealRates;
                
                const hasFirst = !!m.firstHalf;
                const hasSecond = !!m.secondHalf;
                const hasFeast = (m.feast === true);

                const feastOffEligible = (!hasFeast) && ( (hasFirst && hasSecond) || (!hasFirst && hasSecond) );
                
                if (!feastOffEligible) {
                    return { eligible: false, amount: 0, isCleared: false };
                }

                const paidFullOrSecond = (hasFirst && hasSecond && m.paidFirst && m.paidSecond) || (!hasFirst && hasSecond && m.paidSecond);

                if (paidFullOrSecond) {
                    return {
                        eligible: true,
                        amount: r.feastDiscount,
                        isCleared: !!m.refundPaid
                    };
                }

                return { eligible: false, amount: 0, isCleared: false };
            }

            calculateUserDue(m) {
                if (!m) return 0;
                const totalCost = this.calculateUserMealTotal(m);
                if (totalCost === 0) return 0;

                const r = this.db.mealRates;
                let paidAmount = 0;
                const hasFirst = !!m.firstHalf;
                const hasSecond = !!m.secondHalf;
                const hasFeast = (m.feast === true);

                if (hasFirst && hasSecond) {
                    if (m.paidFirst && m.paidSecond) {
                        paidAmount += (!hasFeast) ? (r.fullMeal - r.feastDiscount) : r.fullMeal;
                    } else {
                        if (m.paidFirst) paidAmount += r.firstHalf;
                        if (m.paidSecond) paidAmount += (r.fullMeal - r.firstHalf);
                    }
                } 
                else if (hasFirst && !hasSecond) {
                    if (m.paidFirst) paidAmount += r.firstHalf;
                    if (hasFeast && m.paidFeast) paidAmount += r.standaloneFeast;
                } 
                else if (!hasFirst && hasSecond) {
                    if (m.paidSecond) paidAmount += (!hasFeast) ? (r.secondHalf - r.feastDiscount) : r.secondHalf;
                } 
                else {
                    if (hasFeast && m.paidFeast) paidAmount += r.standaloneFeast;
                }

                const due = totalCost - paidAmount;
                return Math.max(0, due);
            }

            init() {
                setTimeout(() => {
                    const loader = document.getElementById('appLoadingSpinner');
                    if (loader) loader.classList.add('hidden');
                    this.checkAutoLogin();
                }, 300);
            }

            showToast(msg) {
                const toast = document.getElementById('toast');
                if (!toast) return;
                toast.innerText = msg;
                toast.classList.remove('opacity-0');
                setTimeout(() => toast.classList.add('opacity-0'), 3000);
            }

            checkAutoLogin() {
                try {
                    const sessionUser = sessionStorage.getItem("NMC_SESSION_USER");
                    if (sessionUser) {
                        this.currentUser = JSON.parse(sessionUser);
                        this.renderApp();
                    } else {
                        this.renderLogin();
                    }
                } catch(e) {
                    this.renderLogin();
                }
            }

            login(phone) {
                phone = phone.trim();
                if (phone === SECRET_ADMIN) {
                    this.currentUser = {
                        id: "SECRET_ADMIN",
                        name: "Super Admin",
                        phone: SECRET_ADMIN,
                        gender: "Male",
                        batch: 0,
                        isSecretAdmin: true
                    };
                    sessionStorage.setItem("NMC_SESSION_USER", JSON.stringify(this.currentUser));
                    this.showToast("সিক্রেট হেড একাউন্টে সফলভাবে লগইন হয়েছে!");
                    this.renderApp();
                    return;
                }

                const user = this.db.users.find(u => u.phone === phone);
                if (user) {
                    this.currentUser = user;
                    sessionStorage.setItem("NMC_SESSION_USER", JSON.stringify(this.currentUser));
                    this.showToast(`স্বাগতম, ${user.name}`);
                    this.renderApp();
                } else {
                    this.showToast("নম্বরটি সিস্টেমে পাওয়া যায়নি! রেজিস্ট্রেশন করুন।");
                }
            }

            register(userData) {
                const numRegex = /^[0-9]+$/;
                if (!numRegex.test(userData.batch) || !numRegex.test(userData.roll) || !numRegex.test(userData.floor) || !numRegex.test(userData.room)) {
                    this.showToast("ব্যাচ, রোল, ফ্লোর এবং রুম নম্বর শুধুমাত্র ইংরেজী সংখ্যায় লিখুন!");
                    return false;
                }

                if (this.db.users.some(u => u.phone === userData.phone)) {
                    this.showToast("এই ফোন নম্বর দিয়ে ইতিমধ্যে একাউন্ট রয়েছে!");
                    return false;
                }

                const newUser = {
                    id: Date.now().toString(),
                    name: userData.name.trim(),
                    phone: userData.phone.trim(),
                    gender: userData.gender,
                    batch: parseInt(userData.batch),
                    roll: parseInt(userData.roll),
                    floor: parseInt(userData.floor),
                    room: parseInt(userData.room),
                    fb: userData.fb ? userData.fb.trim() : ""
                };

                this.db.users.push(newUser);
                this.saveData();
                this.currentUser = newUser;
                sessionStorage.setItem("NMC_SESSION_USER", JSON.stringify(this.currentUser));
                this.showToast("একাউন্ট সফলভাবে তৈরি হয়েছে!");
                this.renderApp();
                return true;
            }

            logout() {
                sessionStorage.removeItem("NMC_SESSION_USER");
                this.currentUser = null;
                document.getElementById('bottomNav').classList.add('hidden');
                document.getElementById('userInfoHeader').classList.add('hidden');
                this.renderLogin();
            }

            getRoles() {
                if (this.currentUser && this.currentUser.isSecretAdmin) {
                    return { isCentral: true, isPeripheral: true, isSecret: true };
                }

                const user = this.currentUser;
                if (!user) return { isCentral: false, isPeripheral: false, isSecret: false };

                let isCentral = false;
                if (this.db.handoverCentral) {
                    isCentral = (this.db.handoverCentral === user.id);
                } else {
                    isCentral = (user.id === this.db.centralUserId) || (user.batch === this.db.currentCentralBatch && user.gender === "Male" && user.roll === 1);
                }

                let isPeripheral = false;
                const currentBatch = user.gender === "Male" ? this.db.currentPeripheralBatchMale : this.db.currentPeripheralBatchFemale;
                
                if (user.batch === currentBatch) {
                    const sameGender = this.db.users
                        .filter(u => u.batch === currentBatch && u.gender === user.gender)
                        .sort((a,b) => a.roll - b.roll);
                    
                    const activePeripherals = sameGender.slice(0, 2).map(u => u.id);

                    if (user.gender === "Male" && this.db.handoverPeripheralMale && this.db.handoverPeripheralMale.length > 0) {
                        isPeripheral = this.db.handoverPeripheralMale.includes(user.id);
                    } else if (user.gender === "Female" && this.db.handoverPeripheralFemale && this.db.handoverPeripheralFemale.length > 0) {
                        isPeripheral = this.db.handoverPeripheralFemale.includes(user.id);
                    } else {
                        isPeripheral = activePeripherals.includes(user.id);
                    }
                }

                return { isCentral, isPeripheral, isSecret: false };
            }

            navigate(tab) {
                this.currentTab = tab;
                document.querySelectorAll('#bottomNav button').forEach(btn => btn.classList.remove('active-tab'));
                const activeBtn = document.getElementById(`nav-${tab}`);
                if (activeBtn) activeBtn.classList.add('active-tab');

                if (tab === 'notices') {
                    localStorage.setItem('NMC_LAST_READ_NOTICE', (this.db.noticeUpdatedTime || 0).toString());
                }

                this.renderApp();
            }

            renderApp() {
                this.checkAndPerformWeeklyReset();

                document.getElementById('bottomNav').classList.remove('hidden');
                document.getElementById('userInfoHeader').classList.remove('hidden');
                
                const roles = this.getRoles();
                const badge = document.getElementById('roleBadge');
                if (roles.isCentral) badge.innerText = "সেন্ট্রাল";
                else if (roles.isPeripheral) badge.innerText = "পেরিফেরাল";
                else badge.innerText = `ব্যাচ ${this.currentUser.batch || 'এডমিন'}`;

                const navPeripheral = document.getElementById('nav-peripheral');
                const navNotices = document.getElementById('nav-notices');
                const navPdf = document.getElementById('nav-pdf');
                const noticeBadge = document.getElementById('noticeBadge');

                if (roles.isCentral || roles.isPeripheral || roles.isSecret) {
                    navPeripheral.classList.remove('hidden');
                    navPdf.classList.remove('hidden');
                } else {
                    navPeripheral.classList.add('hidden');
                    navPdf.classList.add('hidden');
                }

                navNotices.classList.remove('hidden');
                const lastRead = parseInt(localStorage.getItem('NMC_LAST_READ_NOTICE') || '0');
                const hasUnreadNotice = !!(this.db.centralNotices && this.db.centralNotices.trim().length > 0 && (this.db.noticeUpdatedTime || 0) > lastRead);
                
                if (hasUnreadNotice) {
                    noticeBadge.classList.remove('hidden');
                } else {
                    noticeBadge.classList.add('hidden');
                }

                const main = document.getElementById('mainContainer');
                main.innerHTML = "";

                if (this.db.systemSuspended && !roles.isCentral && !roles.isSecret) {
                    main.innerHTML = `
                        <div class="bg-red-950/40 border border-red-600/50 p-6 rounded-2xl text-center my-10">

                            <p class="text-sm text-gray-300 mt-2">সেন্ট্রাল থেকে সাময়িকভাবে মেসের সমস্ত মিল কার্যক্রম স্থগিত রাখা হয়েছে। বিস্তারিত জানতে সেন্ট্রাল ভাইয়ার সাথে যোগাযোগ করুন।</p>
                        </div>
                    `;
                    return;
                }

                switch (this.currentTab) {
                    case 'home':
                        this.renderHome(main);
                        break;
                    case 'meal':
                        this.renderMealStatus(main);
                        break;
                    case 'peripheral':
                        if (roles.isCentral || roles.isPeripheral || roles.isSecret) {
                            this.renderMembersView(main);
                        } else {
                            this.navigate('home');
                        }
                        break;
                    case 'notices':
                        this.renderNoticesView(main);
                        break;
                    case 'pdf':
                        if (roles.isCentral || roles.isPeripheral || roles.isSecret) {
                            this.renderPdfView(main);
                        } else {
                            this.navigate('home');
                        }
                        break;
                    case 'guide':
                        this.renderGuide(main);
                        break;
                }
            }

                    phone: form.phone.value,

                    batch: form.batch.value,
                    roll: form.roll.value,
                    floor: form.floor.value,
                    room: form.room.value,

                this.register(data);

            getRunningAuthorityContactsHtml() {
                const u = this.currentUser;
                const isMale = u ? u.gender === 'Male' : true;

                let centralUser = null;
                if (this.db.handoverCentral) {
                    centralUser = this.db.users.find(x => x.id === this.db.handoverCentral);
                }
                if (!centralUser) {
                    centralUser = this.db.users.find(x => x.id === this.db.centralUserId) ||
                                  this.db.users.find(x => x.batch === this.db.currentCentralBatch && x.gender === "Male" && x.roll === 1);
                }

                let peripheralUsers = [];
                const curBatch = isMale ? this.db.currentPeripheralBatchMale : this.db.currentPeripheralBatchFemale;
                const handoverList = isMale ? this.db.handoverPeripheralMale : this.db.handoverPeripheralFemale;

                if (handoverList && handoverList.length > 0) {
                    peripheralUsers = this.db.users.filter(x => handoverList.includes(x.id));
                } else {
                    const sortedSameGender = this.db.users
                        .filter(x => x.batch === curBatch && x.gender === (isMale ? 'Male' : 'Female'))
                        .sort((a,b) => a.roll - b.roll);
                    peripheralUsers = sortedSameGender.slice(0, 2);
                }

                return `

                                        <i class="fa-solid fa-phone"></i> ${centralUser.phone}
                                    </a>
                                </div>
                            ` : ''}

                            ${peripheralUsers.length > 0 ? peripheralUsers.map(p => `
                                <div class="bg-black/40 p-2.5 rounded-xl border border-gray-800 flex items-center justify-between">
                                    <div>
                                        <div class="flex items-center gap-1.5 font-bold text-gray-200">

                                        </div>
                                        <div class="text-[11px] text-gray-400 mt-0.5">ব্যাচ ${p.batch} | রোল ${p.roll} | রুম ${p.room}</div>

                                        <i class="fa-solid fa-phone text-brand-orange"></i> ${p.phone}
                                    </a>
                                </div>

                            `}
                        </div>
                    </div>
                `;
            }

            dismissNoticeBanner() {
                localStorage.setItem('NMC_DISMISSED_NOTICE_TIME', (this.db.noticeUpdatedTime || Date.now()).toString());
                const banner = document.getElementById('noticeAlertBanner');
                if (banner) banner.remove();

            getCentralControlsHtml() {
                return `
                    <div class="bg-brand-cardBg border border-brand-orange/40 rounded-2xl p-4 mb-4">
                        <div class="flex justify-between items-center mb-3">
                            <h4 class="font-bold text-brand-orange text-sm flex items-center gap-2">

                            </h4>
                            <button onclick="window.appInstance.toggleSystemSuspend()" class="text-xs px-2.5 py-1 rounded font-semibold ${this.db.systemSuspended ? 'bg-emerald-800 text-emerald-200 border border-emerald-600' : 'bg-red-900/80 text-red-200 border border-red-700'}">
                                ${this.db.systemSuspended ? 'সিস্টেম চালু করুন' : 'সিস্টেম স্থগিত করুন'}

                                    <button onclick="window.appInstance.updateNotice()" class="bg-brand-orange text-black font-bold text-xs px-3 rounded-lg hover:bg-brand-lightOrange transition">ব্রডকাস্ট</button>

                                </button>
                                <button onclick="window.appInstance.setMealRatesModal()" class="bg-gray-800 text-xs py-2 rounded-lg border border-gray-700 text-gray-300 hover:text-white">

                                </button>
                            </div>

                                <button onclick="window.appInstance.deleteBatchModal()" class="w-full bg-red-950/60 border border-red-800 text-red-300 hover:bg-red-900 text-xs py-2 rounded-lg font-semibold transition flex items-center justify-center gap-1.5">

                                </button>
                            </div>
                        </div>
                    </div>
                `;

            getMessSummaryHtml() {
                const filteredUsers = this.getFilteredUsersForCurrent();
                let firstHalfCount = 0, secondHalfCount = 0, fullMealCount = 0, feastCount = 0;

                filteredUsers.forEach(u => {
                    const m = this.db.meals[u.id] || {};
                    if (m.firstHalf && m.secondHalf) fullMealCount++;
                    else if (m.firstHalf) firstHalfCount++;
                    else if (m.secondHalf) secondHalfCount++;
                    if (m.feast) feastCount++;
                });

                return `

            updateSummaryFilters(type, value) {
                if (type === 'gender') {
                    this.selectedSummaryGender = value;
                    ['ALL', 'Male', 'Female'].forEach(g => {
                        const btn = document.getElementById(`summaryGender-${g}`);
                        if (btn) {
                            if (g === value) {
                                btn.className = "py-2 rounded-xl border font-semibold border-brand-orange text-brand-orange bg-brand-orange/10";
                            } else {
                                btn.className = "py-2 rounded-xl border font-semibold border-gray-800 text-gray-400 bg-black";
                            }
                        }
                    });
                }
                this.calculateDetailedSummary();
            }

            calculateDetailedSummary() {
                const resultsContainer = document.getElementById('summaryResultsContainer');
                if (!resultsContainer) return;

                const batchVal = document.getElementById('summaryBatchSelect').value;
                const floorVal = document.getElementById('summaryFloorSelect').value;
                const genderVal = this.selectedSummaryGender || 'ALL';

                let users = this.db.users;

                if (genderVal !== 'ALL') users = users.filter(u => u.gender === genderVal);
                if (batchVal !== 'ALL') users = users.filter(u => u.batch == batchVal);
                if (floorVal !== 'ALL') users = users.filter(u => u.floor == floorVal);

                let firstHalfCount = 0;
                let secondHalfCount = 0;
                let fullMealCount = 0;
                let feastCount = 0;
                let maleTotal = 0;
                let femaleTotal = 0;

                users.forEach(u => {
                    if (u.gender === 'Male') maleTotal++;
                    else if (u.gender === 'Female') femaleTotal++;

                    const m = this.db.meals[u.id] || {};
                    if (m.firstHalf && m.secondHalf) fullMealCount++;
                    else if (m.firstHalf) firstHalfCount++;
                    else if (m.secondHalf) secondHalfCount++;
                    if (m.feast) feastCount++;
                });

                resultsContainer.innerHTML = `

                        <span>মোট সদস্য সংখ্যা: <strong class="text-brand-orange">${users.length}</strong> জন</span>
                        <span class="text-[11px] text-gray-400">(ছেলে: ${maleTotal} | মেয়ে: ${femaleTotal})</span>
                    </div>

                    <div class="grid grid-cols-2 gap-2 text-xs pt-1">
                        <div class="bg-brand-cardBg border border-gray-800 p-3 rounded-xl flex items-center justify-between">

                                <span class="font-semibold text-white">১st + ২nd Half</span>
                            </div>

                        </div>
                        <div class="bg-brand-cardBg border border-gray-800 p-3 rounded-xl flex items-center justify-between">
                            <div>
                                <span class="text-gray-400 block text-[11px]">1st Half Only</span>
                                <span class="font-semibold text-white">শুধুমাত্র ১ম হাফ</span>
                            </div>
                            <span class="text-xl font-bold text-brand-orange">${firstHalfCount}</span>
                        </div>
                        <div class="bg-brand-cardBg border border-gray-800 p-3 rounded-xl flex items-center justify-between">
                            <div>
                                <span class="text-gray-400 block text-[11px]">2nd Half Only</span>
                                <span class="font-semibold text-white">শুধুমাত্র ২য় হাফ</span>
                            </div>
                            <span class="text-xl font-bold text-brand-orange">${secondHalfCount}</span>
                        </div>
                        <div class="bg-brand-cardBg border border-gray-800 p-3 rounded-xl flex items-center justify-between">
                            <div>
                                <span class="text-gray-400 block text-[11px]">Friday Feast</span>
                                <span class="font-semibold text-emerald-400">ফিস্ট খাবার</span>
                            </div>
                            <span class="text-xl font-bold text-emerald-400">${feastCount}</span>
                        </div>
                    </div>
                `;
            }

            renderMealStatus(container) {

                }

                                </span>
                                ${showFeastRefund ? `<p class="text-[10px] text-emerald-400 mt-0.5"><i class="fa-solid fa-circle-check mr-1"></i>ফিস্ট অফ থাকায় ৳${this.db.mealRates.feastDiscount} টাকা রিফান্ড ডিসকাউন্ট যুক্ত</p>` : ''}
                            </div>
                            <div class="text-right">
                                <div class="text-xs text-gray-400">মোট: <span class="text-sm font-bold text-gray-200">৳${totalCalculatedCost}</span></div>
                                <div class="text-xs text-gray-400 mt-0.5">বকেয়া: <span class="text-base font-extrabold ${dueAmount === 0 ? 'text-emerald-400' : 'text-brand-orange'}">৳${dueAmount}</span></div>
                            </div>
                        </div>

                        <div class="bg-brand-cardBg border border-brand-border p-4 rounded-2xl flex items-center justify-between">
                            <div>
                                <div class="font-bold text-brand-orange text-sm flex items-center gap-1.5">
                                    <i class="fa-solid fa-utensils text-xs"></i> Full Meal (1st + 2nd Half)
                                </div>
                                <div class="text-xs text-white font-medium mt-0.5">৳ ${this.db.mealRates.fullMeal} <span class="text-[10px] text-gray-400 font-normal">(বৃহস্পতিবার অন করা যায়)</span></div>
                                <div class="text-[10px] text-gray-400 mt-1 flex items-center gap-1">
                                    <i class="fa-solid fa-clock text-amber-500"></i> বৃহস্পতি (৭:৩০ PM - ১০:০০ PM)
                                </div>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" ${isFullMealEffective ? 'checked' : ''} onchange="window.appInstance.toggleFullMeal()" class="sr-only peer">

                                <div class="text-[10px] text-gray-400 mt-1 flex items-center gap-1">
                                    <i class="fa-solid fa-clock text-amber-500"></i> বৃহস্পতি (৭:৩০ PM - ১০:০০ PM)
                                </div>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" ${m.firstHalf ? 'checked' : ''} onchange="window.appInstance.toggleMealOption('firstHalf')" class="sr-only peer">
                                <div class="w-12 h-6 bg-gray-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-brand-orange"></div>
                            </label>
                        </div>

                        <div class="bg-brand-cardBg border border-brand-border p-4 rounded-2xl flex items-center justify-between">
                            <div>
                                <div class="font-bold text-white text-sm">2nd Half Meal</div>
                                <div class="text-xs text-brand-orange font-medium mt-0.5">
                                    ${m.firstHalf ? `৳ ${this.db.mealRates.fullMeal - this.db.mealRates.firstHalf} (1st Half অন থাকায় ফুল মিল ৳${this.db.mealRates.fullMeal} হিসেবে গণ্য)` : `৳ ${this.db.mealRates.secondHalf} (শুধুমাত্র 2nd Half)`}
                                </div>
                                <div class="text-[10px] text-gray-400 mt-1 flex items-center gap-1">
                                    <i class="fa-solid fa-clock text-amber-500"></i> সোমাবার (১০:০০ AM - ১০:০০ PM)
                                </div>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" ${m.secondHalf ? 'checked' : ''} onchange="window.appInstance.toggleMealOption('secondHalf')" class="sr-only peer">
                                <div class="w-12 h-6 bg-gray-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-brand-orange"></div>
                            </label>
                        </div>

                        <div class="bg-brand-cardBg border border-brand-border p-4 rounded-2xl flex items-center justify-between">

                                    ${feastStatusSubtext}
                                </div>
                                <div class="text-[10px] text-gray-400 mt-1 flex items-center gap-1">
                                    <i class="fa-solid fa-clock text-amber-500"></i> বৃহস্পতি (১০:০০ AM - ৬:০০ PM)

            toggleFullMeal() {
                if (!this.isMealToggleAllowed('full')) {
                    this.showToast("সময়সীমা পার হয়ে গেছে! যেকোনো পরিবর্তনের জন্য দায়িত্বপ্রাপ্ত পেরিফেরাল ভাইয়া বা আপুর সাথে যোগাযোগ করুন।");
                    this.renderApp();
                    return;
                }

                const u = this.currentUser;
                if (!this.db.meals[u.id]) {
                    this.db.meals[u.id] = { firstHalf: false, secondHalf: false, feast: false, paidFirst: false, paidSecond: false, paidFeast: false, refundPaid: false, note: "" };
                }

                const currentFull = this.db.meals[u.id].firstHalf && this.db.meals[u.id].secondHalf;
                if (currentFull) {
                    this.db.meals[u.id].firstHalf = false;
                    this.db.meals[u.id].secondHalf = false;
                    this.db.meals[u.id].feast = false;
                } else {
                    this.db.meals[u.id].firstHalf = true;
                    this.db.meals[u.id].secondHalf = true;
                    this.db.meals[u.id].feast = true;
                }

                this.saveData();
                this.showToast(currentFull ? "ফুল মিল অফ করা হয়েছে" : "ফুল মিল অন করা হয়েছে");
                this.renderApp();
            }

            toggleMealOption(type) {
                if (!this.isMealToggleAllowed(type)) {
                    this.showToast("সময়সীমা পার হয়ে গেছে! যেকোনো পরিবর্তনের জন্য দায়িত্বপ্রাপ্ত পেরিফেরাল ভাইয়া বা আপুর সাথে যোগাযোগ করুন।");
                    this.renderApp();
                    return;
                }

                const u = this.currentUser;
                if (!this.db.meals[u.id]) {
                    this.db.meals[u.id] = { firstHalf: false, secondHalf: false, feast: false, paidFirst: false, paidSecond: false, paidFeast: false, refundPaid: false, note: "" };
                }

                const currentVal = !!this.db.meals[u.id][type];
                this.db.meals[u.id][type] = !currentVal;

                if (type === 'secondHalf' && !currentVal) {
                    this.db.meals[u.id].feast = true;
                }

                this.saveData();

                const users = this.getFilteredUsersForCurrent();

                const floors = [...new Set(users.map(u => u.floor))].sort();

                container.innerHTML = `

                            <h2 class="text-xl font-bold text-brand-orange">মেস মেম্বার্স লিস্ট</h2>
                            <p class="text-xs text-gray-400">ফিল্টার ও পেমেন্ট হিসেব অনুযায়ী তালিকা</p>
                        </div>
                        ${roles.isPeripheral || roles.isSecret ? `
                            <button onclick="window.appInstance.handoverRoleModal('peripheral')" class="text-xs bg-brand-orange/20 border border-brand-orange text-brand-orange px-2.5 py-1.5 rounded-lg">
                                পেরিফেরাল ট্রান্সফার
                            </button>
                        ` : ''}
                    </div>

                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <div>
                            <select id="filterBatch" onchange="window.appInstance.handleFilterChange('batch', this.value)" class="w-full bg-brand-cardBg border border-gray-700 rounded-xl p-2 text-xs text-white focus:border-brand-orange focus:outline-none">
                                <option value="ALL" ${this.memberFilters.batch === 'ALL' ? 'selected' : ''}>সকল ব্যাচ</option>
                                ${batches.map(b => `<option value="${b}" ${this.memberFilters.batch == b ? 'selected' : ''}>ব্যাচ ${b}</option>`).join('')}

                        </div>
                        <div>
                            <select id="filterFloor" onchange="window.appInstance.handleFilterChange('floor', this.value)" class="w-full bg-brand-cardBg border border-gray-700 rounded-xl p-2 text-xs text-white focus:border-brand-orange focus:outline-none">
                                <option value="ALL" ${this.memberFilters.floor === 'ALL' ? 'selected' : ''}>সকল ফ্লোর</option>
                                ${floors.map(f => `<option value="${f}" ${this.memberFilters.floor == f ? 'selected' : ''}>ফ্লোর ${f}</option>`).join('')}
                            </select>

                    </div>

                    <div class="grid grid-cols-2 gap-2 mb-4">
                        <div>
                            <select id="filterPayment" onchange="window.appInstance.handleFilterChange('payment', this.value)" class="w-full bg-brand-cardBg border border-gray-700 rounded-xl p-2 text-xs text-white focus:border-brand-orange focus:outline-none">
                                <option value="ALL" ${this.memberFilters.payment === 'ALL' ? 'selected' : ''}>সকল পেমেন্ট স্ট্যাটাস</option>

                                <option value="DUE" ${this.memberFilters.payment === 'DUE' ? 'selected' : ''}>বকেয়া রয়েছে (Due)</option>
                                <option value="REFUND" ${this.memberFilters.payment === 'REFUND' ? 'selected' : ''}>রিফান্ড পাওনা রয়েছে</option>
                            </select>

                                <option value="HAS_NOTE" ${this.memberFilters.note === 'HAS_NOTE' ? 'selected' : ''}>নোট যুক্ত মেম্বার্স</option>

            handleFilterChange(type, value) {
                this.memberFilters[type] = value;
                this.renderMembersList();
            }

            getFilteredUsersForCurrent() {
                const u = this.currentUser;
                const roles = this.getRoles();

                let list = this.db.users;
                
                if (roles.isSecret) {
                    list = this.db.users;
                } else if (roles.isCentral) {
                    list = this.db.users.filter(x => x.gender === "Male");
                } else if (roles.isPeripheral) {
                    list = this.db.users.filter(x => x.gender === u.gender);
                } else if (u.gender === "Female") {
                    list = this.db.users.filter(x => x.gender === "Female");
                }

                return list.sort((a, b) => {
                    if (a.floor !== b.floor) return a.floor - b.floor;
                    if (a.room !== b.room) return a.room - b.room;
                    if (a.roll !== b.roll) return a.roll - b.roll;
                    return a.name.localeCompare(b.name);
                });
            }

            renderMembersList() {
                const listContainer = document.getElementById('membersListContainer');
                if (!listContainer) return;

                const batchFilter = this.memberFilters.batch;
                const floorFilter = this.memberFilters.floor;
                const paymentFilter = this.memberFilters.payment;
                const noteFilter = this.memberFilters.note;

                let users = this.getFilteredUsersForCurrent();

                if (batchFilter !== 'ALL') users = users.filter(u => u.batch == batchFilter);
                if (floorFilter !== 'ALL') users = users.filter(u => u.floor == floorFilter);

                users = users.filter(user => {
                    const m = this.db.meals[user.id] || {};
                    const dueAmount = this.calculateUserDue(m);
                    const totalCost = this.calculateUserMealTotal(m);
                    const refundDetails = this.getUserRefundDetails(m);
                    
                    const isPaidCleared = (dueAmount === 0 || totalCost === 0);

                    if (paymentFilter === 'PAID' && !isPaidCleared) return false;
                    if (paymentFilter === 'DUE' && isPaidCleared) return false;
                    if (paymentFilter === 'REFUND' && (!refundDetails.eligible || refundDetails.isCleared)) return false;

                    const hasNote = m.note && m.note.trim().length > 0;
                    if (noteFilter === 'HAS_NOTE' && !hasNote) return false;

                    return true;
                });

                const roles = this.getRoles();
                const canModifyData = roles.isPeripheral || roles.isSecret;

                if (users.length === 0) {
                    listContainer.innerHTML = `
                        <div class="text-center py-8 text-gray-500 bg-brand-cardBg border border-brand-border rounded-xl">

                    const userDueAmount = this.calculateUserDue(m);
                    const refundDetails = this.getUserRefundDetails(m);

                    const hasActiveSecond = !!m.secondHalf;
                    const hasActiveFeast = (m.feast === true);
                    const hasAnyMeal = hasActiveFirst || hasActiveSecond || hasActiveFeast;

                    const isFullPaid = hasAnyMeal ? (
                        (!hasActiveFirst || m.paidFirst) &&
                        (!hasActiveSecond || m.paidSecond) &&
                        (!hasActiveFeast || m.paidFeast)
                    ) : true;

                    const safeNote = (m.note || '').replace(/"/g, '&quot;');

                    return `
                        <div class="bg-brand-cardBg border border-brand-border rounded-xl p-3 flex flex-col gap-2">
                            <div class="flex justify-between items-start">
                                <div>
                                    <div class="font-bold text-white text-sm flex items-center gap-2">
                                        <span>${user.name}</span>
                                        ${user.fb ? `<a href="${user.fb}" target="_blank" class="text-blue-400 text-xs"><i class="fa-brands fa-facebook"></i></a>` : ''}
                                    </div>
                                    <div class="text-xs text-gray-400">রোল: ${user.roll} | ব্যাচ: ${user.batch} | ফ্লোর: ${user.floor} | রুম: ${user.room}</div>
                                    <div class="text-xs text-gray-500 mt-0.5"><i class="fa-solid fa-phone mr-1"></i>${user.phone}</div>
                                </div>
                                <div class="text-right">
                                    <span class="text-xs font-semibold px-2 py-0.5 rounded ${user.gender === 'Male' ? 'bg-blue-900/40 text-blue-300' : 'bg-pink-900/40 text-pink-300'}">
                                        ${user.gender === 'Male' ? 'ছেলে' : 'মেয়ে'}
                                    </span>
                                    <div class="mt-1 text-xs flex flex-col items-end">
                                        <div>
                                            <span class="text-gray-400">মোট: </span>
                                            <span class="font-bold text-gray-200">৳${userTotalBill}</span>
                                        </div>
                                        <div>
                                            <span class="text-gray-400">বকেয়া: </span>
                                            <span class="font-bold ${userDueAmount === 0 ? 'text-emerald-400' : 'text-brand-orange'}">৳${userDueAmount}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="border-t border-gray-800 pt-2 flex flex-wrap justify-between items-center gap-2 text-xs">
                                <div class="flex gap-2">
                                    <span class="px-2 py-1 rounded bg-black border ${m.firstHalf ? 'border-emerald-500 text-emerald-400' : 'border-gray-800 text-gray-500'}">
                                        1st: ${m.firstHalf ? 'ON' : 'OFF'}
                                    </span>
                                    <span class="px-2 py-1 rounded bg-black border ${m.secondHalf ? 'border-emerald-500 text-emerald-400' : 'border-gray-800 text-gray-500'}">
                                        2nd: ${m.secondHalf ? 'ON' : 'OFF'}
                                    </span>
                                    <span class="px-2 py-1 rounded bg-black border ${m.feast === true ? 'border-amber-500 text-amber-400' : 'border-gray-800 text-gray-500'}">

                                ${canModifyData ? `
                                    <button onclick="window.appInstance.editUserMealModal('${user.id}')" class="bg-brand-orange/20 border border-brand-orange text-brand-orange text-[11px] px-2 py-1 rounded-lg">
                                        স্ট্যাটাস চেঞ্জ
                                    </button>
                                ` : ''}
                            </div>

                            ${refundDetails.eligible ? `
                                <div class="bg-amber-950/40 border border-amber-600/50 p-2 rounded-lg flex items-center justify-between text-xs">
                                    <div class="flex items-center gap-1.5 text-amber-300 font-medium">
                                        <i class="fa-solid fa-hand-holding-dollar text-amber-400"></i>
                                        <span>Feast Off রিফান্ড পাওনা: <strong class="text-amber-200">৳${refundDetails.amount}</strong></span>
                                    </div>
                                    ${canModifyData ? `
                                        <label class="flex items-center gap-1 text-[11px] font-semibold text-emerald-400 cursor-pointer bg-black/60 px-2 py-1 rounded border border-gray-700">

                                        </label>
                                    ` : `
                                        <span class="text-[10px] ${refundDetails.isCleared ? 'text-emerald-400 font-bold' : 'text-amber-400 font-semibold'}">
                                            ${refundDetails.isCleared ? '✓ পরিশোধিত' : '⏳ পেন্ডিং'}
                                        </span>
                                    `}
                                </div>
                            ` : ''}

                            ${canModifyData ? `

                                            </label>
                                            <span class="text-gray-600">|</span>
                                            <label class="flex items-center gap-1 cursor-pointer ${!hasActiveFirst ? 'opacity-40 cursor-not-allowed' : ''}">
                                                <input type="checkbox" ${m.paidFirst || !hasActiveFirst ? 'checked' : ''} ${!hasActiveFirst ? 'disabled' : ''} onchange="window.appInstance.togglePayment('${user.id}', 'paidFirst')" class="accent-brand-orange">
                                                <span>1st</span>
                                            </label>
                                            <label class="flex items-center gap-1 cursor-pointer ${!hasActiveSecond ? 'opacity-40 cursor-not-allowed' : ''}">
                                                <input type="checkbox" ${m.paidSecond || !hasActiveSecond ? 'checked' : ''} ${!hasActiveSecond ? 'disabled' : ''} onchange="window.appInstance.togglePayment('${user.id}', 'paidSecond')" class="accent-brand-orange">

                                            </label>

                                    </div>
                                    
                                    <div class="flex gap-2">
                                        <input type="text" id="note-${user.id}" value="${safeNote}" oninput="window.appInstance.updateLocalNoteMemory('${user.id}', this.value)" placeholder="নোট (বাকি/ফেরত লিখুন)..." class="flex-1 bg-black border border-gray-800 text-xs rounded-lg px-2.5 py-1.5 text-white placeholder-gray-600 focus:border-brand-orange focus:outline-none">

                                            <i class="fa-solid fa-floppy-disk text-[10px]"></i> সেভ
                                        </button>
                                    </div>
                                </div>
                            ` : (m.note ? `<div class="text-[11px] text-amber-400 bg-amber-950/20 p-2 rounded-lg border border-amber-800/40"><i class="fa-solid fa-sticky-note mr-1"></i> ${m.note}</div>` : '')}
                        </div>
                    `;
                }).join('');
            }

            renderPdfView(container) {
                const roles = this.getRoles();
                const u = this.currentUser;

                let allowedGender = u.gender;
                if (roles.isCentral) allowedGender = "Male";
                if (roles.isSecret) allowedGender = this.pdfTargetGender || "Male";

                const relevantUsers = this.db.users.filter(x => roles.isSecret ? x.gender === allowedGender : x.gender === u.gender);
                const availableBatches = [...new Set(relevantUsers.map(x => x.batch))].sort((a,b) => a - b);
                const availableFloors = [...new Set(relevantUsers.map(x => x.floor))].sort((a,b) => a - b);

                container.innerHTML = `
                    <div class="mb-4">

                        ${roles.isSecret ? `
                            <div>
                                <label class="text-xs text-gray-300 font-semibold block mb-2">১. জেন্ডার নির্বাচন (সুপার এডমিন)</label>
                                <div class="grid grid-cols-2 gap-2">

                                    <button onclick="window.appInstance.setPdfTargetGender('Female')" class="py-2 rounded-xl text-xs border font-semibold ${allowedGender === 'Female' ? 'border-brand-orange text-brand-orange bg-brand-orange/10' : 'border-gray-800 text-gray-400 bg-black'}">মেয়েদের রিপোর্ট</button>
                                </div>
                            </div>
                        ` : ''}

                        <div>
                            <div class="flex justify-between items-center mb-1.5">

                                <button onclick="window.appInstance.toggleAllPdfFilters('batch')" class="text-[10px] text-brand-orange font-medium">সব সিলেক্ট/আনসিলেক্ট</button>
                            </div>
                            <div class="flex flex-wrap gap-1.5 max-h-28 overflow-y-auto p-2 bg-black/60 rounded-xl border border-gray-800" id="pdfBatchContainer">
                                ${availableBatches.map(b => `
                                    <button onclick="window.appInstance.togglePdfFilter('batch', '${b}')" id="pdfBatchBtn-${b}" class="px-2.5 py-1 text-xs rounded-lg border font-medium ${this.pdfBatchFilters.includes('ALL') || this.pdfBatchFilters.includes(b.toString()) ? 'border-brand-orange bg-brand-orange/20 text-brand-orange' : 'border-gray-800 bg-gray-900 text-gray-400'}">
                                        ব্যাচ ${b}
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        <div>
                            <div class="flex justify-between items-center mb-1.5">
                                <label class="text-xs text-gray-300 font-semibold">২. ফ্লোর নির্বাচন (একাধিক সিলেক্ট করা যাবে)</label>
                                <button onclick="window.appInstance.toggleAllPdfFilters('floor')" class="text-[10px] text-brand-orange font-medium">সব সিলেক্ট/আনসিলেক্ট</button>
                            </div>
                            <div class="flex flex-wrap gap-1.5 max-h-28 overflow-y-auto p-2 bg-black/60 rounded-xl border border-gray-800" id="pdfFloorContainer">
                                ${availableFloors.map(f => `
                                    <button onclick="window.appInstance.togglePdfFilter('floor', '${f}')" id="pdfFloorBtn-${f}" class="px-2.5 py-1 text-xs rounded-lg border font-medium ${this.pdfFloorFilters.includes('ALL') || this.pdfFloorFilters.includes(f.toString()) ? 'border-brand-orange bg-brand-orange/20 text-brand-orange' : 'border-gray-800 bg-gray-900 text-gray-400'}">
                                        ফ্লোর ${f}
                                    </button>

                        <div class="bg-black/60 border border-gray-800 rounded-xl p-3 text-xs text-gray-300 space-y-1">
                            <div class="flex justify-between">
                                <span class="text-gray-400">টার্গেট প্যানেল:</span>
                                <span class="font-semibold text-white">${allowedGender === 'Male' ? 'ছেলেদের প্যানেল' : 'মেয়েদের প্যানেল'}</span>

                            <li>নির্দিষ্ট এক বা একাধিক ব্যাচ ও ফ্লোর ফিল্টার করে একদম নিখুঁত রিপোর্ট তৈরি করা যাবে।</li>

            setPdfTargetGender(gender) {
                this.pdfTargetGender = gender;
                this.renderPdfView(document.getElementById('mainContainer'));
            }

            togglePdfFilter(type, value) {
                const targetArray = type === 'batch' ? this.pdfBatchFilters : this.pdfFloorFilters;
                
                if (targetArray.includes('ALL')) {
                    targetArray.length = 0;
                }

                const index = targetArray.indexOf(value.toString());
                if (index > -1) {
                    targetArray.splice(index, 1);
                } else {
                    targetArray.push(value.toString());
                }

                if (targetArray.length === 0) {
                    targetArray.push('ALL');
                }

                this.renderPdfView(document.getElementById('mainContainer'));
            }

            toggleAllPdfFilters(type) {
                const targetArray = type === 'batch' ? this.pdfBatchFilters : this.pdfFloorFilters;
                if (targetArray.includes('ALL')) {
                    targetArray.length = 0;
                } else {
                    targetArray.length = 0;
                    targetArray.push('ALL');
                }
                this.renderPdfView(document.getElementById('mainContainer'));
            }

            generateAndDownloadPDF() {
                const roles = this.getRoles();
                const u = this.currentUser;

                let allowedGender = u.gender;
                if (roles.isCentral) allowedGender = "Male";
                if (roles.isSecret) allowedGender = this.pdfTargetGender || "Male";

                let users = this.db.users.filter(x => x.gender === allowedGender);

                if (!this.pdfBatchFilters.includes('ALL')) {
                    users = users.filter(x => this.pdfBatchFilters.includes(x.batch.toString()));
                }

                if (!this.pdfFloorFilters.includes('ALL')) {
                    users = users.filter(x => this.pdfFloorFilters.includes(x.floor.toString()));
                }

                if (users.length === 0) {
                    this.showToast("সিলেক্টকৃত ফিল্টার অনুযায়ী পিডিএফ তৈরি করার মতো কোনো মেম্বার পাওয়া যায়নি!");
                    return;
                }

                users.sort((a,b) => {
                    if (a.batch !== b.batch) return a.batch - b.batch;
                    if (a.floor !== b.floor) return a.floor - b.floor;
                    return a.roll - b.roll;
                });

                let totalBillsSum = 0;
                let totalDuesSum = 0;

                const cardsHtml = users.map(u => {
                    const m = this.db.meals[u.id] || { firstHalf: false, secondHalf: false, feast: false, paidFirst: false, paidSecond: false, paidFeast: false, refundPaid: false, note: "" };
                    const userTotalBill = this.calculateUserMealTotal(m);
                    const userDueAmount = this.calculateUserDue(m);
                    const refundDetails = this.getUserRefundDetails(m);

                    totalBillsSum += userTotalBill;
                    totalDuesSum += userDueAmount;

                    return `
                        <div class="pdf-card" style="background: #ffffff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px 12px; margin-bottom: 8px; box-sizing: border-box; font-family: 'Hind Siliguri', 'Inter', sans-serif; width: 100%;">
                            <div style="display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; margin-bottom: 5px;">
                                <div>
                                    <span style="font-size: 13px; font-weight: 700; color: #0f172a; display: block; line-height: 1.2;">${u.name}</span>
                                    <span style="font-size: 10px; color: #64748b; font-weight: 500;">ব্যাচ: ${u.batch} | রোল: ${u.roll} | ফ্লোর: ${u.floor} | রুম: ${u.room}</span>
                                </div>
                                <div style="text-align: right;">
                                    <span style="font-size: 11px; font-weight: 700; color: #2563eb; display: block;">বিল: ৳${userTotalBill}</span>
                                    <span style="font-size: 11px; font-weight: 700; color: ${userDueAmount > 0 ? '#dc2626' : '#16a34a'};">বকেয়া: ৳${userDueAmount}</span>
                                </div>
                            </div>

                            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 10px;">
                                <div style="display: flex; gap: 6px;">
                                    <span style="background: ${m.firstHalf ? '#dcfce7' : '#f1f5f9'}; color: ${m.firstHalf ? '#15803d' : '#64748b'}; padding: 1px 5px; border-radius: 4px; font-weight: 600;">1st: ${m.firstHalf ? 'ON' : 'OFF'}</span>
                                    <span style="background: ${m.secondHalf ? '#dcfce7' : '#f1f5f9'}; color: ${m.secondHalf ? '#15803d' : '#64748b'}; padding: 1px 5px; border-radius: 4px; font-weight: 600;">2nd: ${m.secondHalf ? 'ON' : 'OFF'}</span>
                                    <span style="background: ${m.feast ? '#fef3c7' : '#f1f5f9'}; color: ${m.feast ? '#b45309' : '#64748b'}; padding: 1px 5px; border-radius: 4px; font-weight: 600;">Feast: ${m.feast ? 'ON' : 'OFF'}</span>
                                </div>
                                <div style="font-size: 10px; color: #475569; font-weight: 600;">
                                    পেমেন্ট: ${userTotalBill === 0 ? 'মেস অফ' : (userDueAmount === 0 ? '✓ পরিশোধিত (Paid)' : '⏳ বকেয়া')}
                                </div>
                            </div>

                            ${refundDetails.eligible ? `
                                <div style="margin-top: 5px; background: #fffbeb; border: 1px solid #fcd34d; padding: 3px 6px; border-radius: 4px; font-size: 9.5px; color: #92400e; display: flex; justify-content: space-between; align-items: center;">
                                    <span><strong>রিফান্ড পাওনা:</strong> ৳${refundDetails.amount}</span>
                                    <span><strong>স্ট্যাটাস:</strong> ${refundDetails.isCleared ? '✓ পরিশোধিত (Clear)' : '⏳ পেন্ডিং'}</span>
                                </div>
                            ` : ''}

                            ${m.note ? `
                                <div style="margin-top: 5px; background: #f8fafc; border: 1px solid #cbd5e1; padding: 3px 6px; border-radius: 4px; font-size: 9.5px; color: #334155; word-break: break-word;">
                                    <strong>নোট:</strong> ${m.note}
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).join('');

                const printableContainer = document.createElement('div');
                printableContainer.id = "pdfPrintArea";
                printableContainer.style.width = "100%";
                printableContainer.style.maxWidth = "750px";
                printableContainer.style.padding = "16px";
                printableContainer.style.boxSizing = "border-box";
                printableContainer.style.background = "#ffffff";
                printableContainer.style.color = "#000000";

                printableContainer.innerHTML = `
                    <div style="border-bottom: 2px solid #ea580c; padding-bottom: 8px; margin-bottom: 12px; text-align: center;">
                        <h2 style="font-size: 18px; font-weight: 800; color: #ea580c; margin: 0;">নোয়াখালী মেডিকেল কলেজ মেস সিস্টেম</h2>
                        <p style="font-size: 11px; color: #475569; margin: 2px 0 0 0;">মেস মেম্বার মিল ও পেমেন্ট সামারি রিপোর্ট (${allowedGender === 'Male' ? 'ছেলেদের প্যানেল' : 'মেয়েদের প্যানেল'})</p>
                        <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 10px; color: #64748b; border-top: 1px solid #f1f5f9; padding-top: 4px;">
                            <span>ব্যাচ: <strong>${this.pdfBatchFilters.join(', ')}</strong></span>
                            <span>ফ্লোর: <strong>${this.pdfFloorFilters.join(', ')}</strong></span>
                            <span>মোট সদস্য: <strong>${users.length} জন</strong></span>
                            <span>তারিখ: <strong>${new Date().toLocaleDateString('bn-BD')}</strong></span>
                        </div>
                    </div>

                    <div style="margin-bottom: 10px;">
                        ${cardsHtml}
                    </div>

                    <div style="background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px 12px; font-size: 11px; display: flex; justify-content: space-between; font-weight: 700; color: #0f172a;" class="pdf-card">
                        <span>সর্বমোট মিল বিল: ৳${totalBillsSum}</span>
                        <span>সর্বমোট বকেয়া: ৳${totalDuesSum}</span>
                    </div>
                `;

                document.body.appendChild(printableContainer);

                this.showToast("পিডিএফ ফাইল প্রসেস হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...");

                const opt = {
                    margin:       [0.3, 0.3, 0.3, 0.3],
                    filename:     `NMC_Mess_Report_${allowedGender}_${Date.now()}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2, useCORS: true, scrollX: 0, scrollY: 0 },
                    jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' },
                    pagebreak:    { mode: ['css', 'legacy'] }
                };

                html2pdf().set(opt).from(printableContainer).save().then(() => {
                    printableContainer.remove();
                    this.showToast("পিডিএফ রিপোর্ট সফলভাবে ডাউনলোড হয়েছে!");
                }).catch(err => {
                    console.error("PDF generation error:", err);
                    printableContainer.remove();
                    this.showToast("পিডিএফ ডাউনলোডে সমস্যা হয়েছে!");
                });
            }

            toggleRefundClearance(userId, checked) {
                if (!this.db.meals[userId]) {
                    this.db.meals[userId] = { firstHalf: false, secondHalf: false, feast: false, paidFirst: false, paidSecond: false, paidFeast: false, refundPaid: false, note: "" };
                }
                this.db.meals[userId].refundPaid = checked;
                this.saveData();
                this.showToast(checked ? "রিফান্ড ফেরত দেওয়া সম্পন্ন হয়েছে!" : "রিফান্ড স্ট্যাটাস পেন্ডিং করা হয়েছে");

                if (this.currentUser && this.currentUser.id === userId) {
                    this.renderApp();
                } else {
                    this.renderMembersList();
                }
            }

            updateLocalNoteMemory(userId, text) {
                if (!this.db.meals[userId]) {
                    this.db.meals[userId] = { firstHalf: false, secondHalf: false, feast: false, paidFirst: false, paidSecond: false, paidFeast: false, refundPaid: false, note: "" };
                }
                this.db.meals[userId].note = text;
            }

            saveUserNote(userId) {
                const noteInput = document.getElementById(`note-${userId}`);
                const val = noteInput ? noteInput.value : (this.db.meals[userId]?.note || "");

                if (!this.db.meals[userId]) {
                    this.db.meals[userId] = { firstHalf: false, secondHalf: false, feast: false, paidFirst: false, paidSecond: false, paidFeast: false, refundPaid: false, note: "" };
                }

                this.db.meals[userId].note = val;
                this.saveData();
                this.showToast("নোট সফলভাবে সংরক্ষণ করা হয়েছে!");
            }

            toggleFullPayment(userId, checked) {
                if (!this.db.meals[userId]) {
                    this.db.meals[userId] = { firstHalf: false, secondHalf: false, feast: false, paidFirst: false, paidSecond: false, paidFeast: false, refundPaid: false, note: "" };
                }
                this.db.meals[userId].paidFirst = checked;
                this.db.meals[userId].paidSecond = checked;
                this.db.meals[userId].paidFeast = checked;
                this.saveData();
                this.showToast(checked ? "সব পেমেন্ট পেইড হিসেবে চিহ্নিত হয়েছে" : "পেমেন্ট আনচেক করা হয়েছে");
                
                if (this.currentUser && this.currentUser.id === userId) {
                    this.renderApp();
                } else {
                    this.renderMembersList();
                }
            }

            togglePayment(userId, field) {
                if (!this.db.meals[userId]) {
                    this.db.meals[userId] = { firstHalf: false, secondHalf: false, feast: false, paidFirst: false, paidSecond: false, paidFeast: false, refundPaid: false, note: "" };
                }
                this.db.meals[userId][field] = !this.db.meals[userId][field];
                this.saveData();
                this.showToast("পেমেন্ট স্ট্যাটাস আপডেট হয়েছে!");
                
                if (this.currentUser && this.currentUser.id === userId) {
                    this.renderApp();
                } else {
                    this.renderMembersList();
                }
            }

            saveProfile(form) {
                const numRegex = /^[0-9]+$/;
                if (!numRegex.test(form.batch.value) || !numRegex.test(form.roll.value) || !numRegex.test(form.floor.value) || !numRegex.test(form.room.value)) {
                    this.showToast("ব্যাচ, রোল, ফ্লোর এবং রুম নম্বর শুধুমাত্র ইংরেজী সংখ্যায় লিখুন!");
                    return;
                }

                const newPhone = form.phone.value.trim();
                if (this.db.users.some(u => u.phone === newPhone && u.id !== this.currentUser.id)) {
                    this.showToast("এই ফোন নম্বর দিয়ে ইতিমধ্যে অন্য একটি একাউন্ট রয়েছে!");
                    return;
                }

                this.currentUser.name = form.name.value.trim();
                this.currentUser.phone = newPhone;
                this.currentUser.batch = parseInt(form.batch.value);
                this.currentUser.roll = parseInt(form.roll.value);
                this.currentUser.floor = parseInt(form.floor.value);
                this.currentUser.room = parseInt(form.room.value);
                this.currentUser.fb = form.fb.value.trim();

                const index = this.db.users.findIndex(u => u.id === this.currentUser.id);
                if (index !== -1) {
                    this.db.users[index] = { ...this.currentUser };
                }

                this.saveData();
                sessionStorage.setItem("NMC_SESSION_USER", JSON.stringify(this.currentUser));
                this.closeModal();
                this.showToast("প্রোফাইল আপডেট হয়েছে!");
                this.renderApp();
            }

                const roles = this.getRoles();
                let targetGender = 'Male';

                if (roleType === 'central') {
