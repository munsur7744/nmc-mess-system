                    if (roles.isSecret) {
                        targetGender = this.selectedHandoverGender || 'Female';
                    } else {
                        targetGender = this.currentUser.gender;
                    }
                }

                const availableUsers = this.db.users.filter(u => u.gender === targetGender);
                const batches = [...new Set(availableUsers.map(u => u.batch))].sort((a,b) => b - a);
                const defaultBatch = batches.length > 0 ? batches[0] : null;

                const modalHtml = `
                    <div id="modalBackdrop" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                        <div class="bg-brand-cardBg border border-brand-border rounded-2xl p-5 w-full max-w-sm space-y-3">
                            <h3 class="font-bold text-brand-orange text-base">${roleType === 'central' ? 'সেন্ট্রালশিপ' : 'পেরিফেরাল'} দায়িত্ব হ্যান্ডওভার</h3>
                            
                            ${roles.isSecret && roleType === 'peripheral' ? `
                                <div>
                                    <label class="text-gray-300 block mb-1 text-xs font-semibold">প্যানেল সিলেক্ট করুন (সুপার এডমিন)</label>
                                    <div class="grid grid-cols-2 gap-2 text-xs">
                                        <button type="button" onclick="window.appInstance.switchHandoverGender('Female', '${roleType}')" class="py-1.5 rounded-lg border font-semibold ${targetGender === 'Female' ? 'border-brand-orange bg-brand-orange/20 text-brand-orange' : 'border-gray-800 bg-black text-gray-400'}">মেয়েদের প্যানেল</button>
                                        <button type="button" onclick="window.appInstance.switchHandoverGender('Male', '${roleType}')" class="py-1.5 rounded-lg border font-semibold ${targetGender === 'Male' ? 'border-brand-orange bg-brand-orange/20 text-brand-orange' : 'border-gray-800 bg-black text-gray-400'}">ছেলেদের প্যানেল</button>
                                    </div>
                                </div>
                            ` : `<p class="text-xs text-gray-400">মেম্বার সিলেক্ট করে দায়িত্ব হস্তান্তর সম্পন্ন করুন (${targetGender === 'Male' ? 'ছেলে' : 'মেয়ে'} প্যানেল)</p>`}

                            <div class="space-y-3 text-xs pt-1">
                                ${roleType === 'peripheral' ? `
                                    <div>
                                        <label class="text-gray-300 block mb-1 font-semibold">১. কোন পেরিফেরাল পরিবর্তন করবেন?</label>
                                        <select id="peripheralSlotSelect" class="w-full bg-black border border-gray-700 p-2.5 rounded-lg text-white focus:border-brand-orange focus:outline-none">
                                            <option value="0">পেরিফেরাল ১</option>
                                            <option value="1">পেরিফেরাল ২</option>
                                        </select>
                                    </div>
                                ` : ''}

                                <div>
                                    <label class="text-gray-300 block mb-1 font-semibold">${roleType === 'peripheral' ? '২' : '১'}. ব্যাচ সিলেক্ট করুন</label>
                                    <select id="handoverBatchSelect" onchange="window.appInstance.updateHandoverUserList('${roleType}', '${targetGender}')" class="w-full bg-black border border-gray-700 p-2.5 rounded-lg text-white focus:border-brand-orange focus:outline-none">
                                        ${batches.map(b => `<option value="${b}">ব্যাচ ${b}</option>`).join('')}
                                    </select>
                                </div>

                                <div>
                                    <label class="text-gray-300 block mb-1 font-semibold">${roleType === 'peripheral' ? '৩' : '২'}. নতুন দায়িত্বপ্রাপ্ত সদস্য সিলেক্ট করুন</label>
                                    <select id="handoverTarget" class="w-full bg-black border border-gray-700 p-2.5 rounded-lg text-white focus:border-brand-orange focus:outline-none">
                                        <!-- Dynamic -->
                                    </select>
                                </div>
                            </div>

                            <div class="flex gap-2 mt-4">
                                <button onclick="window.appInstance.closeModal()" class="w-1/2 py-2 bg-gray-800 text-gray-300 rounded-lg text-xs">বাতিল</button>
                                <button onclick="window.appInstance.processHandover('${roleType}')" class="w-1/2 py-2 bg-brand-orange text-black font-bold rounded-lg text-xs">হ্যান্ডওভার করুন</button>
                            </div>
                        </div>
                    </div>
                `;
                document.body.insertAdjacentHTML('beforeend', modalHtml);
                if (defaultBatch) {
                    this.updateHandoverUserList(roleType, targetGender);
                }
            }

            switchHandoverGender(gender, roleType) {
                this.selectedHandoverGender = gender;
                this.closeModal();
                this.handoverRoleModal(roleType);
            }

            updateHandoverUserList(roleType, targetGender) {
                const batchVal = parseInt(document.getElementById('handoverBatchSelect').value);
                const userSelect = document.getElementById('handoverTarget');

                const filtered = this.db.users
                    .filter(u => u.gender === targetGender && u.batch === batchVal)
                    .sort((a,b) => a.roll - b.roll);

                if (filtered.length === 0) {
                    userSelect.innerHTML = `<option value="">কোনো রেজিস্টার্ড সদস্য পাওয়া যায়নি</option>`;
                } else {
                    userSelect.innerHTML = filtered.map(c => `
                        <option value="${c.id}">${c.name} (রোল ${c.roll})</option>
                    `).join('');
                }
            }

            processHandover(roleType) {
                const targetId = document.getElementById('handoverTarget').value;
                if (!targetId) {
                    this.showToast("অনুগ্রহ করে একজন সঠিক মেম্বার সিলেক্ট করুন!");
                    return;
                }

                const targetUser = this.db.users.find(u => u.id === targetId);

                if (roleType === 'central') {
                    if (this.db.handoverCentral === targetId) {
                        this.showToast("তিনি অলরেডি সেন্ট্রাল ভাইয়া হিসেবে নিয়োজিত আছেন! অন্য একজনকে ট্রান্সফার করুন।");
                        return;
                    }
                    this.db.handoverCentral = targetId;
                    this.db.centralUserId = targetId;
                    this.db.currentCentralBatch = targetUser.batch;
                } else {
                    const slotIndex = parseInt(document.getElementById('peripheralSlotSelect').value || '0');
                    const isMale = targetUser.gender === 'Male';
                    
                    let activeList = isMale ? (this.db.handoverPeripheralMale || []) : (this.db.handoverPeripheralFemale || []);
                    
                    if (activeList.length === 0) {
                        const defaultBatch = isMale ? this.db.currentPeripheralBatchMale : this.db.currentPeripheralBatchFemale;
                        const defaultPeripherals = this.db.users
                            .filter(u => u.batch === defaultBatch && u.gender === targetUser.gender)
                            .sort((a,b) => a.roll - b.roll)
                            .slice(0, 2)
                            .map(u => u.id);
                        activeList = [...defaultPeripherals];
                    }

                    if (activeList.includes(targetId)) {
                        this.showToast("তিনি অলরেডি পেরিফেরাল হিসেবে নিয়োজিত আছেন! অন্য একজনকে ট্রান্সফার করুন।");
                        return;
                    }

                    // Replace the specific peripheral slot ensuring 2 peripherals always exist
                    if (activeList.length < 2) {
                        activeList[slotIndex] = targetId;
                    } else {
                        activeList[slotIndex] = targetId;
                    }

                    if (isMale) {
                        this.db.handoverPeripheralMale = activeList;
                        this.db.currentPeripheralBatchMale = targetUser.batch;
                    } else {
                        this.db.handoverPeripheralFemale = activeList;
                        this.db.currentPeripheralBatchFemale = targetUser.batch;
                    }
                }

                this.saveData();
                this.closeModal();
                this.showToast("দায়িত্ব সফলভাবে হ্যান্ডওভার করা হয়েছে!");
                this.renderApp();
            }

            updateNotice() {
                const inputEl = document.getElementById('noticeInput');
                const val = inputEl ? inputEl.value.trim() : "";
                this.db.centralNotices = val;
                this.db.noticeUpdatedTime = Date.now();
                this.saveData();

                if (val) {
                    this.showToast("সেন্ট্রাল নোটিশ সফলভাবে ব্রডকাস্ট করা হয়েছে!");
                } else {
                    this.showToast("নোটিশ মুছে ফেলা হয়েছে!");
                }
                this.renderApp();
            }

            toggleSystemSuspend() {
                this.db.systemSuspended = !this.db.systemSuspended;
                this.saveData();
                this.showToast(this.db.systemSuspended ? "মেস সিস্টেম স্থগিত করা হয়েছে" : "মেস সিস্টেম পুনরায় চালু করা হয়েছে");
                this.renderApp();
            }

            closeModal() {
                const backdrop = document.getElementById('modalBackdrop');
                if (backdrop) backdrop.remove();
            }
        }

        // Initialize Global App
        window.onload = function() {
            window.appInstance = new MessApp();
        };
    </script>
</body>
    </html>
